# PCI/PCIe storage family — config fragment merged into the board .gen by
# native.mk ($(DRIVERCONF)).  mkdevc accumulates `misc' sections across the
# whole config, so these register in addition to the board's own controllers.
# Each sd<NAME> here emits an `extern SDifc sd<NAME>ifc' added to sdifc[], so
# the sd subsystem can probe the controller.  Keep in sync with the DRIVERC
# list in sd-pci.mk.  (The shared SCSI helper sd-scsi has no SDifc and is not
# listed here.)
misc
	sdiahci
	sdnvme
