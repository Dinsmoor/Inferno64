# PCI/PCIe Ethernet family — config fragment merged into the board .gen by
# native.mk ($(DRIVERCONF)).  mkdevc accumulates `link' sections across the
# whole config, so these register in addition to the board's own links.
# Each name NAME emits a call to etherNAMElink() in links(), which does
# addethercard() so devether can probe the card.  Keep in sync with the
# DRIVERC list in ether-pci.mk.
link
	etherrtl8139
	etherigbe
	ether82563
